            if (!m) return null;
            return m[1][0];   // 单升/单降返回一个符号；双升双降简化
        }

        // 在候选拼写中循环切换（dir = +1 / -1）
        function cycleEnharmonic(pitch, dir) {
            const info = parsePitch(pitch);
            if (!info) return pitch;
            const cands = enharmonicCandidates(info.midi);
            if (cands.length < 2) return pitch;
            // 当前拼写
            const cur = pitch.match(/^([a-g])([#b]*)\/(\d+)$/);
            const curLetter = cur[1];
            const curAcc = (cur[2].match(/#/g) || []).length - (cur[2].match(/b/g) || []).length;
            let idx = cands.findIndex(c => c.letter === curLetter && c.acc === curAcc);
            if (idx < 0) idx = 0;
            idx = ((idx + dir) % cands.length + cands.length) % cands.length;
            const c = cands[idx];
            return spellFrom(info.midi, c.letter, c.acc).pitch;
        }

        // 切换当前选中音符的等音拼写
        function changeSelectedEnharmonic(dir) {
            if (!state.selNote) { setStatus('请先点击一个音符选中它', true); return; }
            const sel = state.selNote;
            const list = state.measures[sel.m].voices[sel.voice];
            const nt = list.find(n => n.beat === sel.beat && !n.rest);
            if (!nt) { state.selNote = null; render(); return; }
            const np = cycleEnharmonic(nt.pitch, dir);
            if (np === nt.pitch) { setStatus('该音没有其它等音写法'); return; }
            snapshot();
            nt.pitch = np;
            setStatus('已切换为 ' + pitchLabel(np));
            render();
        }

        function voiceNoteAt(m, beat, voice) {
            const list = state.measures[m].voices[voice];
            return list.find(nt => {
                if (nt.rest) return false;
                const span = noteSpan(nt);
                return span[0] <= beat && beat < span[1];
            }) || null;
        }

        function chordFromBeat(m, beat) {
            const voices = ['S', 'A', 'T', 'B'];
            const notes = voices.map(v => voiceNoteAt(m, beat, v));
            if (notes.some(n => !n)) return { missing: true };
            const parsed = notes.map(n => parsePitch(n.pitch));
            if (parsed.some(p => !p)) return { missing: true };
            return { missing: false, notes, parsed };
        }

        function identifyChord(parsed) {
            const unique = [...new Set(parsed.map(p => p.pc))].sort((a, b) => a - b);
            const has = pc => unique.includes(((pc % 12) + 12) % 12);
            if (unique.length === 3) {
                for (const r of unique) {
                    if (has(r + 4) && has(r + 7)) return { kind: 'triad', root: ((r % 12) + 12) % 12, quality: 'major' };
                    if (has(r + 3) && has(r + 7)) return { kind: 'triad', root: ((r % 12) + 12) % 12, quality: 'minor' };
                    if (has(r + 3) && has(r + 6)) return { kind: 'triad', root: ((r % 12) + 12) % 12, quality: 'dim' };
                }
                return { kind: null, root: null, quality: null };
            }
            if (unique.length === 4) {
                const patterns = [
                    { q: 'dom7', iv: [0, 4, 7, 10] },
                    { q: 'maj7', iv: [0, 4, 7, 11] },
                    { q: 'min7', iv: [0, 3, 7, 10] },
                    { q: 'halfdim7', iv: [0, 3, 6, 10] },
                    { q: 'dim7', iv: [0, 3, 6, 9] }
                ];
                for (const r of unique) {
                    for (const p of patterns) {
                        if (p.iv.every(x => has(r + x))) {
                            return { kind: 'seventh', root: ((r % 12) + 12) % 12, quality: p.q };
                        }
                    }
                }
                return { kind: null, root: null, quality: null };
            }
            return { kind: null, root: null, quality: null };
        }

        function funcRootPc(func) {
            const tonic = keyTonicPc();
            if (func === 'S' || func === 's') return ((tonic + 5) % 12 + 12) % 12;
            if (func === 'D') return ((tonic + 7) % 12 + 12) % 12;
            return tonic;
        }

        function funcQuality(func) {
            if (func === 'D') return 'major';
            return KEY_OPTIONS[state.keyIndex].major ? 'major' : 'minor';
        }

        function expectedBassPc(func, inv) {
            const root = funcRootPc(func);
            const q = funcQuality(func);
            const pc = x => ((x % 12) + 12) % 12;
            const third = root + (q === 'minor' ? 3 : 4);
            const fifth = root + 7;
            const seventh = root + 10;
            switch (inv) {
                case 'none': return pc(root);
                case '6': return pc(third);
                case '64': return pc(fifth);
                case '7': return pc(root);
                case '56': return pc(third);
                case '34': return pc(fifth);
                case '2': return pc(seventh);
                default: return null;
            }
        }

        function checkLabelMatch(lbl, info) {
            if (!info.func) return false;
            if (lbl.func === 'K') {
                return (info.func === 'T' || info.func === 't') && info.inv === '64';
            }
            return lbl.func === info.func && lbl.inv === info.inv;
        }

        function doubledPc(parsed) {
            const counts = {};
            parsed.forEach(p => { counts[p.pc] = (counts[p.pc] || 0) + 1; });
            for (const k of Object.keys(counts)) if (counts[k] >= 2) return parseInt(k, 10);
            return null;
        }

        function intervalCategory(a, b) {
            const diff = Math.abs(a - b);
            if (diff === 0) return 'unison';
            const mod = ((diff % 12) + 12) % 12;
            if (mod === 7) return 'p5';
            if (mod === 0) return 'octave';
            return null;
        }

        function checkChord(m, lbl) {
            const errors = [];
            const chord = chordFromBeat(m, lbl.beat);
            if (chord.missing) {
                errors.push('该拍位四声部不完整');
                return { m, beat: lbl.beat, ok: false, errors };
            }
            const parsed = chord.parsed;
            const ident = identifyChord(parsed);
            if (ident.root == null) {
                errors.push('无法识别为和弦');
                return { m, beat: lbl.beat, ok: false, errors };
            }

            const tonic = keyTonicPc();
            const deg = ((ident.root - tonic) % 12 + 12) % 12;
            const majorKey = KEY_OPTIONS[state.keyIndex].major;
            let actualFunc = null;
            if (deg === 0) actualFunc = majorKey ? 'T' : 't';
            else if (deg === 5) actualFunc = majorKey ? 'S' : 's';
            else if (deg === 7) actualFunc = 'D';
            const minorThird = ['minor', 'dim', 'min7', 'halfdim7', 'dim7'].includes(ident.quality);
            const dimFifth = ['dim', 'halfdim7', 'dim7'].includes(ident.quality);
            const third = ((ident.root + (minorThird ? 3 : 4)) % 12 + 12) % 12;
            const fifth = ((ident.root + (dimFifth ? 6 : 7)) % 12 + 12) % 12;
            let seventh = null;
            if (ident.kind === 'seventh') {
                if (ident.quality === 'maj7') seventh = ((ident.root + 11) % 12 + 12) % 12;
                else if (ident.quality === 'dim7') seventh = ((ident.root + 9) % 12 + 12) % 12;
                else seventh = ((ident.root + 10) % 12 + 12) % 12;
            }
            const bass = parsed.reduce((a, p) => (p.midi < a.midi ? p : a));
            let actualInv = null;
            if (ident.kind === 'triad') {
                if (bass.pc === ident.root) actualInv = 'none';
                else if (bass.pc === third) actualInv = '6';
                else if (bass.pc === fifth) actualInv = '64';
            } else {
                if (bass.pc === ident.root) actualInv = '7';
                else if (bass.pc === third) actualInv = '56';
                else if (bass.pc === fifth) actualInv = '34';
                else if (bass.pc === seventh) actualInv = '2';
            }
            const info = { func: actualFunc, inv: actualInv, third, fifth };

            // 1) 排列：声部交叉与间距
            const [S, A, T, B] = parsed.map(p => p.midi);
            if (S < A || A < T || T < B) errors.push('声部交叉');
            if (S - A > 12) errors.push('高音-中音＞八度');
            if (A - T > 12) errors.push('中音-次中音＞八度');
            if (T - B > 24) errors.push('次中音-低音＞两个八度');

            // 2) 低音
            const expectedBass = expectedBassPc(lbl.func, lbl.inv);
            if (expectedBass != null && bass.pc !== expectedBass) errors.push('低音错');

            // 3) 标记
            if (!checkLabelMatch(lbl, info)) errors.push('标记与和弦不符');

            // 4) 排列：重复音规则（目前只对三和弦检查）
            const doubled = doubledPc(parsed);
            if (ident.kind === 'triad' && doubled != null) {
                const leading = ((tonic + 11) % 12 + 12) % 12;
                if (info.inv === '6' && doubled === info.third) errors.push('六和弦重复了三音');
                if (info.inv === '64' && doubled !== info.fifth) errors.push('四六和弦应重复五音');
                if (info.inv === 'none' && doubled === leading) errors.push('重复了导音');
            }

            return { m, beat: lbl.beat, ok: errors.length === 0, errors };
        }

        function runCheck() {
            const labeled = [];
            state.measures.forEach((measure, mi) => {
                measure.chordLabels.forEach(lbl => labeled.push({ m: mi, lbl }));
            });
            labeled.sort((a, b) => (a.m - b.m) || (a.lbl.beat - b.lbl.beat));
            const results = labeled.map(item => checkChord(item.m, item.lbl));

            // 4) 连接：平行五度 / 平行八度
            for (let i = 1; i < labeled.length; i++) {
                const pChord = chordFromBeat(labeled[i - 1].m, labeled[i - 1].lbl.beat);
                const cChord = chordFromBeat(labeled[i].m, labeled[i].lbl.beat);
                if (pChord.missing || cChord.missing) continue;
                const pv = pChord.parsed, cv = cChord.parsed;
                const pairs = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];
                let parallel = false;
                pairs.forEach(([x, y]) => {
                    const c1 = intervalCategory(pv[x].midi, pv[y].midi);
                    const c2 = intervalCategory(cv[x].midi, cv[y].midi);
                    if (!c1 || !c2) return;
                    const fifthPair = (c1 === 'p5' && c2 === 'p5');
                    const octavePair = ((c1 === 'octave' || c1 === 'unison') && (c2 === 'octave' || c2 === 'unison'));
                    if (!fifthPair && !octavePair) return;
                    const d1 = cv[x].midi - pv[x].midi;
                    const d2 = cv[y].midi - pv[y].midi;
                    if (d1 !== 0 && d2 !== 0 && ((d1 > 0 && d2 > 0) || (d1 < 0 && d2 < 0))) parallel = true;
                });
                if (parallel) {
                    results[i].errors.push('与前和弦平行五/八度');
                    results[i].ok = false;
                }
            }

            state.checkResults = results;
            render();
            showCheckSummary(results);
        }

        function showCheckSummary(results) {
            const el = document.getElementById('check-summary');
            if (!results.length) {
                el.innerHTML = '<div>尚未放置和弦标记，无法检查。请先用「标记」模式点拍位放置 T/S/D。</div>';
                return;
            }
            el.innerHTML = results.map(r => {
                const loc = '第' + (r.m + 1) + '小节 ' + beatLabel(r.beat);
                if (r.ok) return '<div class="ok">✓ ' + loc + '：正确</div>';
                return '<div class="bad">✗ ' + loc + '：' + r.errors.join('；') + '</div>';
            }).join('');
        }

        // ---------- 命中检测 ----------
        function nearestIdx(xs, x) {
            let idx = 0, min = Infinity;
            xs.forEach((v, i) => { const d = Math.abs(v - x); if (d < min) { min = d; idx = i; } });
            return idx;
        }

        function locate(x, y) {
            const sys = state.ui.systems.find(s => y >= s.y1 && y <= s.y2);
            if (!sys) return null;

            // 先判断是否点在某条小节线上：收集本系统所有小节的右边缘线坐标
            const barCandidates = [];
            for (const m of sys.measures) {
                const g = state.ui.measureGeom[m];
                if (!g) continue;
                barCandidates.push({ measure: m, x: g.x2 });
            }
            // 若点击位置非常接近某条小节线（±10px），判定为选小节线
            let nearestBar = null, minBarDist = Infinity;
            barCandidates.forEach(bc => {
                const d = Math.abs(bc.x - x);
                if (d < minBarDist) { minBarDist = d; nearestBar = bc; }
            });
            if (nearestBar && minBarDist <= 10) {
                return { type: 'barline', measure: nearestBar.measure };
            }

            // 否则判定为点击节拍位
            let mi = null;
            for (const m of sys.measures) {
                const g = state.ui.measureGeom[m];
                if (g && x >= g.x1 && x <= g.x2) { mi = m; break; }
            }
            if (mi == null) return null;
            const g = state.ui.measureGeom[mi];
            const idx = nearestIdx(g.beatXs, x);
            return { type: 'beat', measure: mi, beat: idx * 0.25 };
        }

        function buildKeySelect() {
            const sel = document.getElementById('key-select');
            sel.innerHTML = '';
            KEY_OPTIONS.forEach((k, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = k.letter + k.acc + ' ' + (k.major ? '大调' : '小调') + '（' + k.sig + '）';
                sel.appendChild(opt);
            });
            sel.value = state.keyIndex;
        }

        function buildChordFuncButtons() {
            const wrap = document.getElementById('chord-func-btns');
            const majorKey = KEY_OPTIONS[state.keyIndex].major;
            const funcs = majorKey ? ['T', 'S', 'D', 'K'] : ['t', 's', 'D', 'K'];
            if (!funcs.includes(state.chordFunc)) state.chordFunc = funcs[0];
            wrap.innerHTML = '';
            funcs.forEach(f => {
                const btn = document.createElement('button');
                btn.className = 'func-btn' + (f === state.chordFunc ? ' active' : '');
                btn.textContent = f;
                btn.dataset.func = f;
                btn.addEventListener('click', () => {
                    state.chordFunc = f;
                    if (f === 'K') state.chordInv = '64';
                    document.querySelectorAll('.func-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.inv-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.inv === state.chordInv);
                    });
                    updateStatus();
                });
                wrap.appendChild(btn);
            });
            document.querySelectorAll('.inv-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.inv === state.chordInv);
            });
        }

        // ---------- 钢琴 ----------
        // 计算某音名（如 c#/4）的 midi 音高
        function midiOfPitch(p) { const info = parsePitch(p); return info ? info.midi : null; }

        function buildPiano() {
            const pianoEl = document.getElementById('piano');
            pianoEl.innerHTML = '';
            const order = ['c', 'c#', 'd', 'd#', 'e', 'f', 'f#', 'g', 'g#', 'a', 'a#', 'b'];
            const keys = [];
            for (let oct = 2; oct <= 5; oct++) {
                order.forEach(n => keys.push({ pitch: n + '/' + oct, black: n.includes('#') }));
            }
            keys.push({ pitch: 'c/6', black: false });
            keys.forEach(k => {
                const midi = midiOfPitch(k.pitch);
                const btn = document.createElement('button');
                btn.className = 'piano-key ' + (k.black ? 'black' : 'white');
                btn.textContent = k.pitch.toUpperCase();
                btn.dataset.midi = midi;
                btn.addEventListener('click', (e) => {
                    onPianoKey(pitchFromMidiKey(midi, k.pitch));
                    if (e.currentTarget && e.currentTarget.blur) e.currentTarget.blur();
                });
                pianoEl.appendChild(btn);
            });
        }

        // 点击琴键时决定写入的音名：
        // - 白键固定音名（c/d/e...），用调号拼写
        // - 黑键先用"调号感知的默认拼写"（如 G 大调的 F# 键 → f#）
        function pitchFromMidiKey(midi, keyPitch) {
            const isBlack = keyPitch.includes('#');
            if (!isBlack) {
                // 白键：直接用其自然音名 + 当前八度（保持八度不变）
                const m = keyPitch.match(/^([a-g])\/(\d+)$/);
                if (m) return m[1] + '/' + m[2];
            }
            // 黑键：按调号智能拼写
            return spellDefault(midi);
        }

        // 让指定的琴键水平居中显示（默认 F4）
        function centerPianoOn(pitch) {
            const pianoEl = document.getElementById('piano');
            if (!pianoEl) return;
            const midi = midiOfPitch(pitch);
            const key = pianoEl.querySelector('.piano-key[data-midi="' + midi + '"]');
            if (!key) return;
            const target = key.offsetLeft + key.offsetWidth / 2 - pianoEl.clientWidth / 2;
            pianoEl.scrollLeft = Math.max(0, target);
        }

        function onPianoKey(pitch) {
            if (!requireUser()) return;
            if (state.mode === 'erase') { setStatus('当前是橡皮模式，请点击谱面删除音符', true); return; }
            if (state.mode === 'rest') { setStatus('当前是休止模式，请点击谱面插入休止', true); return; }
            if (state.mode === 'tie') { setStatus('当前是连线模式，请点击谱面选择两个音符', true); return; }
            if (state.mode === 'label') { setStatus('当前是标记模式，请点击谱面放置和弦标记', true); return; }
            if (state.mode === 'select') { setStatus('当前是选择模式，请点击谱面选择音符', true); return; }
            if (state.tripletPending) {
                state.tripletPending.notes.push(pitch);
                if (state.tripletPending.notes.length < 3) {
                    setStatus('三连音 已输入 ' + state.tripletPending.notes.length + '/3 个音');
                    return;
                }
                commitTriplet();
                return;
            }
            insertNote(pitch);
        }

        // ---------- 播放 ----------
        const TIMBRES = {
            piano: { wave: 'triangle', attack: 0.01, level: 0.25, decay: 1.1 },
            strings: { wave: 'sawtooth', attack: 0.12, level: 0.14, sustain: true, release: 0.15, filter: 2400, vibrato: { rate: 5, depth: 7 } },
            horn: { wave: 'sawtooth', attack: 0.06, level: 0.15, sustain: true, release: 0.12, filter: 950, vibrato: { rate: 4.5, depth: 6 } },
            voice: { wave: 'sawtooth', attack: 0.08, level: 0.14, sustain: true, release: 0.12, formants: [700, 1150], vibrato: { rate: 5, depth: 6 } }
        };

        let audioCtx = null;
        let tupletSeq = 0;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function freqOf(pitch) {
            const m = pitch.match(/^([a-g])([#b]*)\/(\d+)$/);
            if (!m) return 440;
            const semis = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
            let accidental = 0;
            (m[2] || '').split('').forEach(ch => { accidental += (ch === '#' ? 1 : -1); });
            const midi = (parseInt(m[3], 10) + 1) * 12 + semis[m[1]] + accidental;
            return 440 * Math.pow(2, (midi - 69) / 12);
        }
        function playTone(ctx, freq, start, dur, timbreName) {
            const t = TIMBRES[timbreName] || TIMBRES.piano;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = t.wave;
            osc.frequency.value = freq;

            if (t.vibrato) {
                const lfo = ctx.createOscillator();
                const lfoGain = ctx.createGain();
                lfo.frequency.value = t.vibrato.rate;
                lfoGain.gain.value = t.vibrato.depth;
                lfo.connect(lfoGain).connect(osc.detune);
                lfo.start(start);
                lfo.stop(start + dur + 0.05);
            }

            let tail = osc;
            if (t.filter) {
                const f = ctx.createBiquadFilter();
                f.type = 'lowpass';
                f.frequency.value = t.filter;
                tail.connect(f);
                tail = f;
            }
            if (t.formants) {
                const b1 = ctx.createBiquadFilter(); b1.type = 'bandpass'; b1.frequency.value = t.formants[0]; b1.Q.value = 5;
                const b2 = ctx.createBiquadFilter(); b2.type = 'bandpass'; b2.frequency.value = t.formants[1]; b2.Q.value = 5;
                const mix = ctx.createGain();
                tail.connect(b1); tail.connect(b2);
                b1.connect(mix); b2.connect(mix);
                tail = mix;
            }

            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(t.level, start + t.attack);
            if (t.decay) {
                gain.gain.exponentialRampToValueAtTime(0.0001, start + Math.min(dur, t.decay));
            } else {
                gain.gain.setValueAtTime(t.level, start + Math.max(t.attack, dur - (t.release || 0.1)));
                gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
            }

            tail.connect(gain).connect(ctx.destination);
            osc.start(start);
            osc.stop(start + dur + 0.05);
        }
        let playbackAnimId = null;
        let playbackCursorEl = null;

        function clearPlaybackCursor() {
            if (playbackAnimId) { cancelAnimationFrame(playbackAnimId); playbackAnimId = null; }
            if (playbackCursorEl && playbackCursorEl.parentNode) playbackCursorEl.parentNode.removeChild(playbackCursorEl);
            playbackCursorEl = null;
        }

        function updatePlaybackCursor(m, beat) {
            const svg = state.ui.svg;
            const g = state.ui.measureGeom[m];
            if (!svg || !g) return;
            const idx = Math.min(Math.round(beat * 4), g.beatXs.length - 1);
            const x = g.beatXs[idx];
            if (!playbackCursorEl) {
                playbackCursorEl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                playbackCursorEl.setAttribute('stroke', '#1565c0');
                playbackCursorEl.setAttribute('stroke-width', '2');
                svg.appendChild(playbackCursorEl);
            }
            playbackCursorEl.setAttribute('x1', x);
            playbackCursorEl.setAttribute('x2', x);
            playbackCursorEl.setAttribute('y1', g.sysTop);
            playbackCursorEl.setAttribute('y2', g.sysBottom);
            scrollToSvgPosition(x, (g.sysTop + g.sysBottom) / 2);
        }

        function playScore() {
            const ctx = getAudioContext();
            const beatDur = 0.6 * (100 / state.playSpeed);
            state.measures.forEach((measure, mi) => {
                VOICES.forEach(v => {
                    measure.voices[v].forEach(nt => {
                        if (nt.rest) return;
                        const start = ctx.currentTime + mi * measureBeats() * beatDur + nt.beat * beatDur;
                        const dur = DUR_BEATS[nt.dur] * beatDur * 0.9;
                        playTone(ctx, freqOf(nt.pitch), start, dur, state.timbre);
                    });
                });
            });
            clearPlaybackCursor();
            const startTime = ctx.currentTime;
            const perMeasure = measureBeats();
            const tick = () => {
                const totalBeats = (ctx.currentTime - startTime) / beatDur;
                const m = Math.floor(totalBeats / perMeasure);
                const beat = totalBeats - m * perMeasure;
                if (m >= state.measures.length) { clearPlaybackCursor(); return; }
                updatePlaybackCursor(m, beat);
                playbackAnimId = requestAnimationFrame(tick);
            };
            playbackAnimId = requestAnimationFrame(tick);
        }

        // ---------- 事件绑定 ----------
        // 让题目 textarea 随内容自动增高（最小 1 行，最大由 CSS max-height 限制）
        function autoGrowTopic() {
            const ta = document.getElementById('topic-input');
            if (!ta) return;
            ta.style.height = 'auto';
            ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
        }

        function setupEvents() {
            // 顶部标签切换：显示对应面板，隐藏其他面板；并按标签进入默认模式
            document.querySelectorAll('.tb-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tb-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.querySelectorAll('.tb-panel').forEach(p => p.classList.remove('active'));
                    const panel = document.querySelector('.tb-panel[data-panel="' + tab.dataset.tab + '"]');
                    if (panel) panel.classList.add('active');

                    // 按标签自动切换写入模式
                    const t = tab.dataset.tab;
                    if (t === 'edit') {
                        setMode('note');
                    } else if (t === 'chord') {
                        setMode('label');
                    }
                });
            });

            document.querySelectorAll('.voice-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.currentVoice = btn.dataset.voice;
                    state.tieStart = null;
                    document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateStatus();
                });
            });
            document.querySelectorAll('.dur-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.currentDuration = btn.dataset.dur;
                    document.querySelectorAll('.dur-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateStatus();
                });
            });
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setMode(btn.dataset.mode);
                });
            });
            document.querySelectorAll('.timbre-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.timbre = btn.dataset.timbre;
                    document.querySelectorAll('.timbre-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateStatus();
                });
            });

            document.getElementById('triplet-btn').addEventListener('click', () => {
                state.tripletArmed = !state.tripletArmed;
                state.tripletPending = null;
                document.getElementById('triplet-btn').classList.toggle('active', state.tripletArmed);
                if (state.tripletArmed) setStatus('三连音：请点击起始拍位，然后点击 3 个音高');
                else updateStatus();
            });

            document.querySelectorAll('.inv-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (state.chordFunc === 'K') { setStatus('终止四六和弦（K）固定为 4/6', true); return; }
                    state.chordInv = btn.dataset.inv;
                    document.querySelectorAll('.inv-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateStatus();
                });
            });
            document.getElementById('check-btn').addEventListener('click', runCheck);

            // 小节线样式按钮：先点小节线选中（橙色高亮），再点样式按钮修改
            document.querySelectorAll('.bar-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (state.selectedBarline == null) {
                        setStatus('请先在谱面上点击要修改的小节线（选中后变橙色）', true);
                        return;
                    }
                    const i = state.selectedBarline;
                    const type = btn.dataset.bar;
                    const typeName = { singleRight: '单竖线', double: '双竖线', boldDoubleRight: '终止线' }[type] || type;
                    const isLast = (i === state.measures.length - 1);
                    if (isLast) {
                        state.endBarType = type;
                        document.getElementById('barline-select').value = type;
                    } else {
                        if (!state.measureBarTypes) state.measureBarTypes = {};
                        state.measureBarTypes[i] = type;
                    }
                    setStatus('已把第 ' + (i + 1) + ' 小节末尾的小节线改为「' + typeName + '」');
                    render();
                });
            });
            document.getElementById('speed-range').addEventListener('input', (e) => {
                state.playSpeed = parseInt(e.target.value, 10);
                document.getElementById('speed-label').textContent = state.playSpeed + '%';
            });

            // 题目输入：自动换行 + 随内容增高
            document.getElementById('topic-input').addEventListener('input', autoGrowTopic);

            document.getElementById('key-select').addEventListener('change', (e) => {
                state.keyIndex = parseInt(e.target.value, 10);
                state.checkResults = null;
                state.chordFunc = (KEY_OPTIONS[state.keyIndex].major ? 'T' : 't');
                state.chordInv = 'none';
                buildChordFuncButtons();
                render();
            });
            document.getElementById('time-select').addEventListener('change', (e) => {
                snapshot();
                state.timeSig = e.target.value;
                state.measures = [newMeasure()];
                state.ties = [];
                state.manualBreaks.clear();
                state.caret = null;
                state.tieStart = null;
                state.selectedBarline = null;
                render();
            });
            document.getElementById('barline-select').addEventListener('change', (e) => {
                state.endBarType = e.target.value;
                render();
            });

            document.getElementById('break-btn').addEventListener('click', toggleLineBreak);
            document.getElementById('add-measure-btn').addEventListener('click', addMeasure);
document.getElementById('del-measure-btn').addEventListener('click', deleteMeasure);
            document.getElementById('enharmonic-up-btn').addEventListener('click', () => changeSelectedEnharmonic(-1));
            document.getElementById('enharmonic-down-btn').addEventListener('click', () => changeSelectedEnharmonic(1));
            document.getElementById('undo-btn').addEventListener('click', undo);
            document.getElementById('clear-btn').addEventListener('click', clearAll);
            document.getElementById('play-btn').addEventListener('click', playScore);
            document.getElementById('export-img-btn').addEventListener('click', exportAsImage);
            document.getElementById('export-pdf-btn').addEventListener('click', exportAsPdf);
            document.getElementById('piano-toggle').addEventListener('click', () => {
                const p = document.getElementById('piano');
                const hidden = (p.style.display === 'none');
                p.style.display = hidden ? 'block' : 'none';
            });

            // 用户信息：修改按钮（会清空练习）、模态保存、回车保存
            document.getElementById('edit-user-btn').addEventListener('click', changeUser);
            document.getElementById('um-save-btn').addEventListener('click', saveUserFromModal);
            ['um-name', 'um-class', 'um-teacher'].forEach(id => {
                document.getElementById(id).addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') saveUserFromModal();
                });
            });

            document.getElementById('score').addEventListener('click', (e) => {
                const svg = state.ui.svg;
                if (!svg) return;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const loc = locate(x, y);
                if (!loc) return;
                if (!requireUser()) return;
                if (loc.type === 'barline') {
                    if (state.selectedBarline === loc.measure) {
                        state.selectedBarline = null;
                    } else {
                        state.selectedBarline = loc.measure;
                        setStatus('已选中第 ' + (loc.measure + 1) + ' 小节末尾的小节线，请到「编辑」标签点样式按钮');
                    }
                    render();
                    return;
                }
                state.selectedBarline = null;
                // 选择模式：点击音符选中（紫色框），用于等音切换；点空白处取消选中
                if (state.mode === 'select') {
                    const hit = findNoteAtClick(loc.measure, loc.beat);
                    if (hit) {
                        state.selNote = { voice: hit.voice, m: loc.measure, beat: hit.nt.beat };
                        setStatus('已选中音符 ' + pitchLabel(hit.nt.pitch) + '，按 ↑/↓ 或点「等音」切换升/降号');
                    } else {
                        state.selNote = null;
                        setStatus('该拍位没有音符');
                    }
                    render();
                    return;
                }
                state.selNote = null;
                if (state.mode === 'label') { placeChordLabel(loc.measure, loc.beat); return; }
                if (state.mode === 'tie') { handleTieClick(loc.measure, loc.beat); return; }
                if (state.mode === 'erase') { deleteAt(loc.measure, loc.beat); return; }
                if (state.mode === 'rest') { insertRestAt(loc.measure, loc.beat); return; }
                if (state.mode === 'note' && state.tripletArmed) {
                    state.tripletPending = { m: loc.measure, beat: loc.beat, notes: [] };
                    setStatus('三连音起始已选，请点击 3 个音高');
                    return;
                }
                state.caret = { m: loc.measure, beat: loc.beat };
                render();
            });

            document.addEventListener('keydown', (e) => {
                // 正在输入框/文本域里打字时不触发快捷键
                const tag = (e.target && e.target.tagName) || '';
                const typing = (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable);
                if (e.key === 'Enter' && !typing) toggleLineBreak();
                // 选中音符后，↑/↓ 切换等音记谱
                if (!typing && state.selNote && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
                    e.preventDefault();
                    changeSelectedEnharmonic(e.key === 'ArrowUp' ? -1 : 1);
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadUser();
            refreshUserBar();
            buildKeySelect();
            buildChordFuncButtons();
            buildPiano();
            setupEvents();
            render();
            autoGrowTopic();
            // 等布局完成后，把 F4 居中显示
            requestAnimationFrame(() => centerPianoOn('f/4'));
            // 每次进入/刷新都先显示用户信息页（必填）；已保存的信息会预填，无需修改直接点保存即可
            openUserModal(true);
        });
        window.addEventListener('resize', render);
    </script>
