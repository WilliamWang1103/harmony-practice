<!DOCTYPE html>
<html>
<head>
    <title>音频测试</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>
    <h1>GM钢琴音色测试</h1>
    <button onclick="testAudio()">测试音频</button>
    <button onclick="testNote('C4')">播放 C4</button>
    <button onclick="testNote('E4')">播放 E4</button>
    <button onclick="testNote('G4')">播放 G4</button>
    
    <script>
        let synth = null;
        
        function initAudio() {
            if (synth) return;
            
            try {
                // 使用简单的合成器模拟GM钢琴音色
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: {
                        type: 'triangle'
                    },
                    envelope: {
                        attack: 0.001,   // 非常短的起音
                        decay: 0.1,
                        sustain: 0.3,
                        release: 0.3     // 较短的释放
                    },
                    volume: -6
                }).toDestination();
                
                console.log('✅ 音频初始化完成');
                return true;
            } catch (e) {
                console.error('音频初始化失败:', e);
                return false;
            }
        }
        
        function testAudio() {
            if (!initAudio()) return;
            
            Tone.start().then(() => {
                console.log('音频上下文已启动');
                synth.triggerAttackRelease("C4", "4n");
            }).catch(e => {
                console.error('启动音频失败:', e);
            });
        }
        
        function testNote(note) {
            if (!initAudio()) return;
            
            Tone.start().then(() => {
                synth.triggerAttackRelease(note, "4n");
            });
        }
        
        // 页面加载时预初始化
        window.addEventListener('load', function() {
            setTimeout(initAudio, 500);
        });
    </script>
</body>
</html>
